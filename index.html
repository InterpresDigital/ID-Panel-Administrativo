    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      // Si esta ventana es un popup de OAuth redireccionado desde Google, notificar a la ventana principal y cerrar de inmediato
      if (window.opener) {
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const hasHashToken = window.location.hash.includes('access_token=');
        
        if (code) {
          try {
            window.opener.postMessage({
              type: 'GOOGLE_OAUTH_CODE',
              code: code
            }, '*');
            window.close();
          } catch (e) {
            console.error("Error enviando respuesta de OAuth (code) al opener:", e);
          }
        } else if (hasHashToken) {
          try {
            window.opener.postMessage({
              type: 'GOOGLE_OAUTH_RESPONSE',
              hash: window.location.hash
            }, '*');
            window.close();
          } catch (e) {
            console.error("Error enviando respuesta de OAuth (token) al opener:", e);
          }
        }
      }
    </script>
    <script>
      // Capturar errores de carga de chunks o de javascript para auto-recuperación y diagnóstico visual
      window.addEventListener('error', (e) => {
        // Ignorar errores que no pertenezcan al contexto de ejecución de JavaScript global (ej. fallos al cargar recursos estáticos)
        if (e.target && e.target !== window) {
          return;
        }

        const msg = e.message || '';
        // 1. Si es un fallo de chunk o caché de versión (al actualizar la app), recargar la página automáticamente
        if (
          msg.includes('dynamically imported module') || 
          msg.includes('Importing a module script failed') || 
          msg.includes('Failed to fetch imported') || 
          msg.includes('Failed to fetch dynamically imported module') ||
          msg.includes("Unexpected token '<'") ||
          msg.includes('Unexpected token')
        ) {
          console.warn('Fallo de versión desactualizada detectado. Recargando app...', e);
          window.location.reload();
          return;
        }

        // 2. Si es otro error de ejecución y el body ya cargó o se puede pintar, mostrar alerta de diagnóstico
        try {
          const errorDiv = document.createElement('div');
          errorDiv.id = 'vite-runtime-error-overlay';
          errorDiv.style.position = 'fixed';
          errorDiv.style.top = '0';
          errorDiv.style.left = '0';
          errorDiv.style.width = '100%';
          errorDiv.style.height = '100%';
          errorDiv.style.background = '#1e293b';
          errorDiv.style.color = '#f87171';
          errorDiv.style.padding = '30px';
          errorDiv.style.zIndex = '999999';
          errorDiv.style.fontFamily = 'monospace';
          errorDiv.style.fontSize = '14px';
          errorDiv.style.overflow = 'auto';
          errorDiv.style.lineHeight = '1.6';
          
          errorDiv.innerHTML = `
            <div style="max-width: 800px; margin: 50px auto; background: #0f172a; padding: 25px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5)">
              <h1 style="color: #ef4444; font-size: 20px; margin-top: 0; margin-bottom: 10px; border-b: 1px solid #334155; padding-bottom: 10px; font-family: sans-serif;">🚨 Error de Ejecución Detectado</h1>
              <p style="color: #94a3b8; font-size: 13px; font-family: sans-serif;">La plataforma no pudo cargar correctamente debido al siguiente error de JavaScript:</p>
              <pre style="background: #1e293b; color: #f87171; padding: 15px; border-radius: 8px; overflow-x: auto; font-size: 13px; margin: 15px 0; font-family: monospace;">${msg}\n\nStack:\n${e.error ? e.error.stack : 'No stack trace available'}</pre>
              <button onclick="window.location.reload(true)" style="background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-family: sans-serif; font-size: 13px;">Recargar Página</button>
            </div>
          `;
          if (document.body) {
            document.body.appendChild(errorDiv);
          } else {
            window.addEventListener('DOMContentLoaded', () => {
              document.body.appendChild(errorDiv);
            });
          }
        } catch (err) {
          console.error("Error al pintar el overlay de diagnóstico:", err);
        }
      }, true);
    </script>
    <script>
      // Desregistrar cualquier Service Worker previo para evitar avisos de instalación PWA
